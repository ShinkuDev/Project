<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Antrean Shinku</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b1329;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .menu-container {
            width: 100%;
            max-width: 480px;
            background: #111a2e;
            border: 2px solid #0284c7;
            border-radius: 20px;
            padding: 35px 25px;
            box-shadow: 0 10px 30px rgba(2, 132, 199, 0.2);
            text-align: center;
        }

        h1 {
            font-size: 20px;
            color: #f8fafc;
            letter-spacing: 1px;
        }

        p.sub-title {
            font-size: 13px;
            color: #38bdf8;
            margin-top: 4px;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .menu-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn-menu {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #162238;
            border: 2px solid #1e293b;
            border-radius: 12px;
            padding: 18px 20px;
            color: white;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-menu:hover {
            border-color: #0284c7;
            background: #1e293b;
            transform: translateY(-2px);
        }

        .info-menu {
            text-align: left;
        }

        .info-menu h3 {
            font-size: 16px;
            color: #f8fafc;
        }

        .info-menu p {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 2px;
        }

        .icon-badge {
            font-size: 22px;
            background: #0284c7;
            width: 42px;
            height: 42px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="menu-container">
        <!-- Header Shinku -->
        <h1>PELAYANAN LOKET SHINKU</h1>
        <p class="sub-title">Portal Pelayanan Antrean Loket</p>

        <!-- Pilihan Halaman -->
        <div class="menu-group">
            <!-- Panggil pengunjung.html -->
            <a href="html/pengunjung.html" target="_blank" class="btn-menu">
                <div class="info-menu">
                    <h3>Layar Pengunjung</h3>
                    <p>Ambil nomor tiket antrean</p>
                </div>
                <div class="icon-badge">📱</div>
            </a>

            <!-- Panggil admin.html -->
            <a href="html/admin.html" target="_blank" class="btn-menu">
                <div class="info-menu">
                    <h3>Panel Admin / Petugas</h3>
                    <p>Kontrol & pemanggilan antrean</p>
                </div>
                <div class="icon-badge">💻</div>
            </a>

            <!-- Panggil display.html -->
            <a href="html/display.html" target="_blank" class="btn-menu">
                <div class="info-menu">
                    <h3>Layar Display Utama (TV)</h3>
                    <p>Tampilan nomor dipanggil di ruang tunggu</p>
                </div>
                <div class="icon-badge">🖥️</div>
            </a>
        </div>
    </div>

</body>
</html>
