<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ambil Tiket Antrean - BMKG</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b1329;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: #111a2e;
            border: 2px solid #0284c7;
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(2, 132, 199, 0.2);
        }

        h1 {
            font-size: 20px;
            color: #f8fafc;
            margin-bottom: 5px;
        }

        p.subtitle {
            font-size: 13px;
            color: #38bdf8;
            margin-bottom: 25px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 8px;
        }

        select {
            width: 100%;
            padding: 14px;
            background: #162238;
            border: 1px solid #1e293b;
            border-radius: 10px;
            color: white;
            font-size: 15px;
            outline: none;
        }

        select:focus {
            border-color: #0284c7;
        }

        .btn-ambil {
            width: 100%;
            padding: 15px;
            background: #0284c7;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-ambil:hover {
            background: #0369a1;
            transform: translateY(-2px);
        }

        /* STRIP TIKET HASIL */
        .tiket-result {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #162238;
            border: 2px dashed #0284c7;
            border-radius: 12px;
        }

        .nomor-tiket {
            font-size: 48px;
            font-weight: 800;
            color: #f59e0b;
            margin: 10px 0;
        }

        .layanan-tiket {
            font-size: 14px;
            color: #38bdf8;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>PELAYANAN LOKET BMKG Banjarbaru</h1>
        <p class="subtitle">Ambil Nomor Antrean Anda</p>

        <div class="form-group">
            <label for="layanan">Pilih Layanan Loket:</label>
            <select id="layanan">
                <option value="Layanan Informasi">Layanan Informasi</option>
                <option value="Layanan Pengaduan">Layanan Pengaduan</option>
                <option value="Layanan Surat & Dokumen">Layanan Surat & Dokumen</option>
            </select>
        </div>

        <button class="btn-ambil" onclick="ambilTiket()">AMBIL TIKET ANTREAN</button>

        <!-- AREA CETAK/HASIL TIKET -->
        <div class="tiket-result" id="tiket-box">
            <div style="font-size: 12px; color: #94a3b8;">NOMOR TIKET ANDA</div>
            <div class="nomor-tiket" id="res-nomor">A-001</div>
            <div class="layanan-tiket" id="res-layanan">Layanan Informasi</div>
            <p style="font-size: 11px; color: #64748b; margin-top: 10px;">Silakan tunggu nomor Anda dipanggil di layar display.</p>
        </div>
    </div>

    <script>
        function ambilTiket() {
            let layananPilihan = document.getElementById('layanan').value;

            // 1. Ambil data antrean & counter nomor dari LocalStorage Shinku
            let daftarAntrean = JSON.parse(localStorage.getItem('antreanShinku')) || [];
            let counterTerakhir = parseInt(localStorage.getItem('counterShinku')) || 0;

            // 2. Buat nomor tiket baru
            counterTerakhir += 1;
            let nomorFormat = 'A-' + String(counterTerakhir).padStart(3, '0');

            let antreanBaru = {
                nomor: nomorFormat,
                layanan: layananPilihan
            };

            // 3. Tambahkan ke daftar antrean
            daftarAntrean.push(antreanBaru);

            // 4. Simpan kembali ke LocalStorage dengan key yang SAMA dengan Admin & Display
            localStorage.setItem('antreanShinku', JSON.stringify(daftarAntrean));
            localStorage.setItem('counterShinku', counterTerakhir);

            // 5. Tampilkan ke layar pengunjung
            document.getElementById('res-nomor').innerText = nomorFormat;
            document.getElementById('res-layanan').innerText = layananPilihan;
            document.getElementById('tiket-box').style.display = 'block';
        }
    </script>
</body>
</html>
